version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: printforge_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./backend
      args:
        MODULE_NAME: api-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:8083
      - PRINTER_SERVICE_URL=http://printer-service:8082
      - ORDER_SERVICE_URL=http://order-service:8084
      - MARKETPLACE_SERVICE_URL=http://marketplace-service:8085
      - PAYMENT_SERVICE_URL=http://payment-service:8086
      - NOTIFICATION_SERVICE_URL=http://notification-service:8087
      - ADMIN_SERVICE_URL=http://admin-service:8088
      - JWT_SECRET=${JWT_SECRET:-bXktc3VwZXItc2VjcmV0LWp3dC1rZXktZm9yLWxvY2FsLWRldi0xMjM0}
    depends_on:
      - auth-service
      - printer-service
      - order-service
      - marketplace-service
      - payment-service
      - notification-service
      - admin-service

  auth-service:
    build:
      context: ./backend
      args:
        MODULE_NAME: auth-service
    environment:
      - PORT=8083
      - DB_URL=jdbc:postgresql://postgres:5432/printforge_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=admin
      - JWT_SECRET=${JWT_SECRET:-bXktc3VwZXItc2VjcmV0LWp3dC1rZXktZm9yLWxvY2FsLWRldi0xMjM0}
    depends_on:
      postgres:
        condition: service_healthy

  printer-service:
    build:
      context: ./backend
      args:
        MODULE_NAME: printer-service
    environment:
      - PORT=8082
      - DB_URL=jdbc:postgresql://postgres:5432/printforge_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=admin
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: ./backend
      args:
        MODULE_NAME: order-service
    environment:
      - PORT=8084
      - DB_URL=jdbc:postgresql://postgres:5432/printforge_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=admin
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  marketplace-service:
    build:
      context: ./backend
      args:
        MODULE_NAME: marketplace-service
    environment:
      - PORT=8085
      - DB_URL=jdbc:postgresql://postgres:5432/printforge_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=admin
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build:
      context: ./backend
      args:
        MODULE_NAME: payment-service
    environment:
      - PORT=8086
      - DB_URL=jdbc:postgresql://postgres:5432/printforge_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=admin
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ./backend
      args:
        MODULE_NAME: notification-service
    environment:
      - PORT=8087
      - DB_URL=jdbc:postgresql://postgres:5432/printforge_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=admin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

  admin-service:
    build:
      context: ./backend
      args:
        MODULE_NAME: admin-service
    environment:
      - PORT=8088
      - DB_URL=jdbc:postgresql://postgres:5432/printforge_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=admin
      - JWT_SECRET=${JWT_SECRET:-bXktc3VwZXItc2VjcmV0LWp3dC1rZXktZm9yLWxvY2FsLWRldi0xMjM0}
    depends_on:
      postgres:
        condition: service_healthy
