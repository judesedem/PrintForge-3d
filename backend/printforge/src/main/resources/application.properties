# ===== Application =====
spring.application.name=printforge

# ===== Database =====
spring.datasource.url=jdbc:postgresql://localhost:5432/printforge_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ===== Server =====
server.port=8080

# ===== File Uploads =====
# Where uploaded 3D model files are stored on disk (relative to where the
# app is launched from). Override with --app.upload.dir=/some/path for a
# real deployment with a persistent volume.
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===== JWT =====
jwt.secret=4b6250655368566d597133743677397a244226452948404d6351665468576d5a
jwt.expiration=86400000

