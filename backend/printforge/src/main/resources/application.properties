# ===== Application =====
spring.application.name=printforge

# ===== Database =====
# DB_URL/DB_USERNAME/DB_PASSWORD env vars override these — same
# ${VAR:default} pattern as JWT_SECRET/PAYSTACK_SECRET_KEY below. Local
# dev keeps working out of the box with zero setup (falls back to the
# same localhost/postgres/admin values as before); set real env vars
# for anything other than local dev. NOTE: this is a new, additional
# override path — it does not replace or conflict with a gitignored
# .env file (loaded via spring-dotenv) that sets the literal
# spring.datasource.* keys directly, which several developer machines
# already do to point local dev at a shared Neon instance. Property
# sources that set spring.datasource.url/username/password directly
# (real OS env vars, or spring-dotenv's .env) always take priority over
# application.properties regardless of what's written here, so that
# existing direct-key setup is completely unaffected by this change.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/printforge_db?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP was already running on these exact values as Spring Boot's
# implicit defaults (pool size 10, no explicit connection-timeout —
# Hikari's own internal default for that is 30000ms). Written out
# explicitly so they're visible/tunable here instead of silently
# inherited, not because the pool was misbehaving — not changing
# maximum-pool-size without a specific reason to.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=5

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Lets Hibernate collapse saveAll() into batched JDBC statements instead
# of one round trip per row — e.g. NotificationService.markAllAsRead(),
# the only multi-row write in the codebase today. order_updates/
# order_inserts group same-table statements together so consecutive rows
# actually land in the same batch rather than being split up by
# interleaved unrelated statements. reWriteBatchedInserts on the
# datasource URL above is the JDBC-driver-level half of this — see
# Handoff.md for why that flag specifically doesn't change anything
# observable for markAllAsRead's UPDATEs (it only rewrites INSERTs).
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true


# ===== Server =====
server.port=8080
server.address=0.0.0.0

# gzip response bodies over 1KB for JSON/text/HTML — directly helps the
# list endpoints (/api/marketplace, /api/print-jobs, /api/files, etc.)
# that currently send full uncompressed JSON to the mobile client.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/html
server.compression.min-response-size=1024

# ===== File Uploads =====
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===== Cloudinary =====
# Get these from your Cloudinary dashboard -> Settings -> API Keys
# Set as environment variables in production - do not commit real values to git
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
# ===== JWT =====
# JWT_SECRET env var overrides this if set. The literal value below is a
# dev-only fallback so things still work out of the box on a fresh clone —
# don't rely on it once this leaves your machine (e.g. before making the
# repo public, or for any real deployment), since anyone who can read this
# file can forge valid tokens for any user. Set a real JWT_SECRET env var
# at that point instead of changing the fallback.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===== CORS =====
# Only matters for browser-based access (e.g. `expo start --web`) — native
# Android/iOS via Expo Go or a built app doesn't send an Origin header and
# isn't subject to CORS at all, so this was never actually blocking mobile
# testing. Comma-separated list; add your own dev machine's address here if
# you ever test --web from somewhere other than localhost.
app.cors.allowed-origins=http://localhost:8081,http://localhost:19006,http://localhost:3000,http://10.77.119.189:8081,http://10.77.119.189:19006


# ===== Paystack =====
# Set PAYSTACK_SECRET_KEY in your environment — never commit the real key.
# Get it from your Paystack dashboard → Settings → API Keys & Webhooks.
# Use the test key (sk_test_...) during development.
paystack.secret-key=${PAYSTACK_SECRET_KEY}

# ===== Admin Seeder =====
# Bootstraps the first ADMIN account on startup (see config/AdminSeeder.java)
# — creating an admin normally requires an existing admin, which is a
# chicken-and-egg problem on a fresh database. ADMIN_PASSWORD has no
# fallback: if it isn't set, seeding is skipped entirely rather than
# creating an account with a guessable default password.
admin.email=${ADMIN_EMAIL:admin@printforge.com}
admin.password=${ADMIN_PASSWORD:}
admin.name=${ADMIN_NAME:System Admin}

# ===== Email (SMTP) =====
# General-purpose templated email infrastructure. NOT yet wired into any
# real flow — forgot-password still doesn't call this (see Handoff.md).
# Defaults point at Gmail's SMTP relay since that's the easiest to test
# against locally with a Google App Password; override MAIL_HOST/PORT for
# a different provider (Mailtrap, a work SMTP relay, etc.). Explicit
# timeouts below so a slow/unreachable SMTP server can't hang a request
# indefinitely — the same class of gap flagged elsewhere in this codebase
# for the Paystack HttpClient (audit #62), applied here proactively since
# this is new outbound-call infrastructure.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender identity used on every outgoing email. Placeholder values —
# replace with real copy before going live, and see Handoff.md for the
# SPF/DKIM/DMARC DNS setup still needed on whichever domain MAIL_FROM
# actually uses.
mail.from=${MAIL_FROM:no-reply@printforge.example}
mail.from-name=${MAIL_FROM_NAME:PrintForge}

# Frontend page the password-reset email links to (?token=... is appended
# by AuthService.forgotPassword()). Defaults to the Expo web dev origin;
# override for whichever real frontend domain/deep link is used later.
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:8081/reset-password}

# ===== Lab Location Seeder =====
# Bootstraps a default lab location on startup (see config/LabLocationSeeder.java).
# Idempotent — skipped once any LabLocation row exists.
lab.name=${LAB_NAME:KNUST 3D Printing Lab}
lab.address=${LAB_ADDRESS:Engineering Block, KNUST, Kumasi}
lab.latitude=${LAB_LATITUDE:6.6745}
lab.longitude=${LAB_LONGITUDE:-1.5716}

# ===== Lab Contact Info Seeder =====
# Bootstraps the single admin-editable contact-info row on startup (see
# config/LabContactInfoSeeder.java, GET/PATCH /api/admin/settings/contact).
# Idempotent — skipped once the row (fixed id=1) exists.
lab.contact-email=${LAB_CONTACT_EMAIL:contact@printforge.example}
lab.contact-phone=${LAB_CONTACT_PHONE:+233000000000}
