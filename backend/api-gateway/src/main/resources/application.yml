server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  # Read-only lookup of a caller's live role (see JwtAuthenticationFilter)
  # against auth-service's users table — the gateway doesn't own this
  # schema, so ddl-auto is deliberately absent (Spring Data JDBC/JPA
  # default is "none" when unset, unlike every other service here which
  # sets spring.jpa.hibernate.ddl-auto=update because they DO own their
  # tables). Same DB_URL/DB_USERNAME/DB_PASSWORD env var names as every
  # other service for consistency (see docker-compose.yml).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/printforge_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "*"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
      routes:
        # Auth Service (port 8083)
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/auth, /api/auth/**

        # Printer Service (port 8082)
        - id: printer-service-route
          uri: ${PRINTER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/printers, /api/printers/**
          filters:
            - JwtAuthenticationFilter

        # Order Service (port 8084)
        - id: order-service-route
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/print-jobs, /api/print-jobs/**, /api/estimates, /api/estimates/**, /api/materials, /api/materials/**, /api/labs, /api/labs/**, /api/job-service, /api/job-service/**
          filters:
            - JwtAuthenticationFilter

        # Marketplace Service (port 8085)
        - id: marketplace-service-route
          uri: ${MARKETPLACE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/marketplace, /api/marketplace/**, /api/files, /api/files/**, /api/follows, /api/follows/**, /api/users, /api/users/**, /api/design-requests, /api/design-requests/**, /api/challenges, /api/challenges/**
          filters:
            - JwtAuthenticationFilter

        # Payment Service (port 8086)
        - id: payment-service-route
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/payments, /api/payments/**
          filters:
            - JwtAuthenticationFilter

        # Notification Service (port 8087)
        #
        # /api/admin/reports/** deliberately lives here, not on
        # admin-service-route below — ReportController's admin endpoints
        # (GET/PATCH/DELETE /api/admin/reports...) are implemented in
        # notification-service, alongside the rest of the moderation
        # system, not in admin-service. This route must stay defined
        # BEFORE admin-service-route: Spring Cloud Gateway matches routes
        # in list order, and admin-service-route's broader /api/admin/**
        # predicate would otherwise catch these paths first and send them
        # to a service that has no matching controller for them (404 on
        # every admin reports call — confirmed directly against the live
        # gateway before this fix, not assumed).
        - id: notification-service-route
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/notifications, /api/notifications/**, /api/reports, /api/reports/**, /api/moderation, /api/moderation/**, /api/admin/reports, /api/admin/reports/**
          filters:
            - JwtAuthenticationFilter

        # Admin Service (port 8088)
        - id: admin-service-route
          uri: ${ADMIN_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/admin, /api/admin/**
          filters:
            - JwtAuthenticationFilter

jwt:
  secret: ${JWT_SECRET:bXktc3VwZXItc2VjcmV0LWp3dC1rZXktZm9yLWxvY2FsLWRldi0xMjM0}

