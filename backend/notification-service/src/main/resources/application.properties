spring.application.name=notification-service
server.port=${PORT:8087}
server.address=0.0.0.0

# Database (shared)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/printforge_db?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# RabbitMQ (optional — only connects when RABBITMQ_HOST env var is set)
spring.autoconfigure.exclude=${RABBITMQ_EXCLUDE:org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration}

# Email (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:no-reply@printforge.example}
mail.from-name=${MAIL_FROM_NAME:PrintForge}

# Admin Seeder
admin.email=${ADMIN_EMAIL:admin@printforge.com}
admin.password=${ADMIN_PASSWORD:}
admin.name=${ADMIN_NAME:System Admin}
