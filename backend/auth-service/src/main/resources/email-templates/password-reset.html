<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
</head>
<body style="font-family: sans-serif; color: #0A182E; background-color: #F0F2F5; padding: 40px;">
    <div style="background-color: #FFFFFF; max-width: 600px; margin: 0 auto; padding: 40px; border-radius: 16px; box-shadow: 0 4px 12px rgba(10, 24, 46, 0.08);">
        <h2 style="color: #FF6A00; margin-top: 0;">PrintForge</h2>
        <h3 style="font-size: 20px; margin-bottom: 24px;">Reset Your Password</h3>
        <p>Hi {{fullName}},</p>
        <p>We received a request to reset your password. Click the button below to choose a new one:</p>
        <div style="text-align: center; margin: 32px 0;">
            <a href="{{resetLink}}" style="background-color: #FF6A00; color: #FFFFFF; text-decoration: none; padding: 14px 28px; border-radius: 8px; font-weight: bold; display: inline-block;">Reset Password</a>
        </div>
        <p style="color: #666666; font-size: 14px;">This link will expire in {{expiryMinutes}} minutes.</p>
        <p style="color: #666666; font-size: 14px;">If you didn't request this, you can safely ignore this email.</p>
    </div>
</body>
</html>
