spring.application.name=order-service
server.port=${PORT:8084}
server.address=0.0.0.0

# Database (shared)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/printforge_db?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# RabbitMQ (optional — only connects when RABBITMQ_HOST env var is set)
spring.autoconfigure.exclude=${RABBITMQ_EXCLUDE:org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your-cloudinary-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your-cloudinary-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-cloudinary-api-secret}

# Lab Location Seeder
lab.name=${LAB_NAME:KNUST 3D Printing Lab}
lab.address=${LAB_ADDRESS:Engineering Block, KNUST, Kumasi}
lab.latitude=${LAB_LATITUDE:6.6745}
lab.longitude=${LAB_LONGITUDE:-1.5716}
